# =============================================================================
# Project Super — OSS default for schiplat/super Docker image
# =============================================================================
# Profile: OSS (no license). Binds 0.0.0.0 so the API/Dashboard are reachable
# from the published port. Non-loopback bind **requires** auth_secret below
# (superd refuses to start without it).
#
# Replace auth_secret before exposing beyond the host. Prefer publishing on
# host loopback: `-p 127.0.0.1:9002:9002`.
#
# For subscription deployments, see super.subscription.example.toml in this folder.
# =============================================================================
# Layout (SUPER_ROOT=/app/super):
#   conf/super.toml       — this file (daemon settings)
#   conf/conf.d/*         — optional program stacks (TOML default, JSON compatible; loaded on start & reload)
#   data/snapshot.json    — persisted program registry (auto-created)
#   logs/                 — superd + child process logs (auto-created)
#   run/                  — runtime (pidfile only if you enable daemonize; keep off in Docker)
#
# Override: copy packaging/docker/conf/ and mount, e.g.
#   -v ./my-conf:/app/super/conf -v ./my-data:/app/super/data
# =============================================================================

# Placeholder so the image can start with host = 0.0.0.0.
# Replace before publishing the API beyond the host (or mount your own conf/).

[server]
auth_secret = "CHANGE-ME-BEFORE-EXPOSE"
# Bind on all interfaces so the API/dashboard is reachable from outside the container.
host = "0.0.0.0"
port = 9002

# Containers/systemd: keep foreground (daemon = false). Never set daemon = true as PID 1.
# daemon = false

# Graceful shutdown: seconds to wait after SIGTERM before SIGKILL.
shutdown_timeout = 10

# Flapping detection: too many restarts within a window → Fatal.
flapping_window = 60
flapping_threshold = 5

# Swagger UI at /api/docs (requires docs feature). Keep false when API is exposed.
enable_docs = false

# Paths below mirror SUPER_ROOT layout. Bootstrap always resolves state/logs
# under /app/super/data and /app/super/logs at runtime.
[storage]
data_file = "data/snapshot.json"
log_dir = "logs"

[logging]
log_level = "info"
log_max_mb = 50
log_backups = 5

[child_logging]
driver = "file"
max_size_mb = 10
max_backups = 5
max_line_size_kb = 64

[include]
# Stack files in conf/conf.d/ are applied on daemon start and `super reload`.
# TOML is the default (`.toml` or no extension); legacy `.json` stacks still work.
# See conf/conf.d/example-stack.toml.example for the schema.
files = ["conf/conf.d/*"]

# -----------------------------------------------------------------------------
# Programs
# -----------------------------------------------------------------------------
# Managed processes are stored in data/snapshot.json (API/CLI/dashboard).
# You can also seed programs by adding stack files (TOML default) under conf/conf.d/.
#
# Example (API after container starts — Bearer = auth_secret above):
#   super login CHANGE-ME-BEFORE-EXPOSE
#   super add --name my-app --autostart /path/to/binary
#
# Example event hook (uncomment to enable):
#
# [[event_hooks]]
# id = "on-fatal"
# command = "sh -c 'logger -t super \"fatal: $SUPER_EVENT\"'"
# events = ["process_fatal"]
# programs = ["*"]
# async = true
# timeout_secs = 30
