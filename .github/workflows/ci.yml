name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  HUGO_VERSION: '0.163.3'

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/benchmark

      - name: Format check
        working-directory: tools/benchmark
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: tools/benchmark
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: tools/benchmark
        run: cargo build --release

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check posts Checks API annotations (and may open/update
    # tracking issues). Without these, the job fails with
    # "Resource not accessible by integration" even when cargo-audit is clean.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit dependencies (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fast guard after packaging/docker move — full image build is tag-only
  # (docker-publish.yml). Fail early if Dockerfile / workflow / Makefile drift.
  docker-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Docker packaging paths
        run: |
          set -euo pipefail
          test -f packaging/docker/Dockerfile
          test -f packaging/docker/conf/super.toml
          test -f packaging/docker/conf/super.subscription.example.toml
          grep -q 'DOCKERFILE[[:space:]]*:=[[:space:]]*packaging/docker/Dockerfile' Makefile
          grep -q 'file: packaging/docker/Dockerfile' .github/workflows/docker-publish.yml
          grep -q 'COPY packaging/docker/conf/' packaging/docker/Dockerfile
          stale=0
          for f in Makefile .github/workflows/docker-publish.yml packaging/docker/Dockerfile; do
            if grep -n 'dockerbuild/' "$f"; then
              echo "::error file=$f::stale docker image path"
              stale=1
            fi
          done
          exit "$stale"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build docs
        working-directory: ./docs
        env:
          HUGO_BASEURL: https://super.docs.sconts.com/
        run: hugo --minify --printPathWarnings

      - name: Smoke-check published pages
        working-directory: ./docs
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/docs/index.html
          test -f public/docs/01-getting-started/index.html
          test -f public/docs/02-essentials/configuration/index.html
          test -f public/docs/07-editions/feature-matrix/index.html
          # Fail CI if stale commercial hostname leaks into the built site
          if grep -RIn 'super\.project\.sconts\.com' public; then
            echo '::error::Built docs still reference super.project.sconts.com'
            exit 1
          fi

      - name: Rebuild with site-relative baseURL for link check
        working-directory: ./docs
        env:
          # Absolute production URLs cannot be resolved offline; rebuild once for local crawl.
          HUGO_BASEURL: /
        run: |
          rm -rf public
          hugo --minify

      - name: Check internal HTML links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # Prefer --root-dir (site root for absolute /… links). Do not use --base /
          # --base-url here: relative hrefs would resolve against the site root and
          # false-positive as 404s (lychee ≥0.24).
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/docs/public
            --exclude-path ${{ github.workspace }}/docs/public/js
            --exclude-path ${{ github.workspace }}/docs/public/css
            'docs/public/**/*.html'
          fail: true
