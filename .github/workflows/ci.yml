name: CI

on:
  push:
    branches: [master, main]
    # Docs-only pushes: Deploy Documentation only (deploy-docs.yml).
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [master, main]
  # Nightly full matrix (ubuntu + macOS): catches platform drift between
  # releases even when nothing landed that day.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

env:
  HUGO_VERSION: '0.163.3'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      benchmark: ${{ steps.filter.outputs.benchmark }}
      audit: ${{ steps.filter.outputs.audit }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'common/**'
              - 'core/**'
              - 'cli/**'
              - 'superd/**'
              - 'dashboard/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            benchmark:
              - 'tools/benchmark/**'
              - '.github/workflows/ci.yml'
            audit:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/audit.toml'
              - '.github/workflows/ci.yml'
            docker:
              - 'packaging/docker/**'
              - 'Makefile'
              - '.github/workflows/docker-publish.yml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    # Nightly/manual runs re-check the full workspace even without fresh changes.
    if: >-
      needs.changes.outputs.rust == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-checks
        with:
          os: ubuntu-latest

  # macOS arm64 hosted runners are capacity-constrained: a starved leg waits
  # ~15 minutes and dies with "The job was not acquired by Runner of type
  # hosted" — wasted wall-clock on every push. Pushes therefore get the fast
  # ubuntu signal only; macOS runs on PRs, the nightly schedule, and on demand
  # (workflow_dispatch).
  rust-macos:
    needs: changes
    if: >-
      (needs.changes.outputs.rust == 'true' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: ./.github/actions/rust-checks
        with:
          os: macos-latest

  benchmark:
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/benchmark

      - name: Format check
        working-directory: tools/benchmark
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: tools/benchmark
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: tools/benchmark
        run: cargo build --release

  audit:
    needs: changes
    # Dependabot PRs run with a read-only GITHUB_TOKEN, so the checks/issues
    # write grants below cannot be honoured and audit-check fails before it
    # scans anything; the merge to master re-runs the audit with full rights.
    if: needs.changes.outputs.audit == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # rustsec/audit-check posts Checks API annotations (and may open/update
    # tracking issues). Without these, the job fails with
    # "Resource not accessible by integration" even when cargo-audit is clean.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit dependencies (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fast guard after packaging/docker move — full image build is tag-only
  # (docker-publish.yml). Fail early if Dockerfile / workflow / Makefile drift.
  docker-layout:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert Docker packaging paths
        run: |
          set -euo pipefail
          test -f packaging/docker/Dockerfile
          test -f packaging/docker/Dockerfile.pack
          test -f packaging/docker/conf/super.toml
          test -f packaging/docker/conf/super.subscription.example.toml
          grep -q 'DOCKERFILE[[:space:]]*:=[[:space:]]*packaging/docker/Dockerfile' Makefile
          grep -q 'DOCKERFILE_PACK: packaging/docker/Dockerfile.pack' .github/workflows/docker-publish.yml
          grep -q 'COPY packaging/docker/conf/' packaging/docker/Dockerfile
          grep -q 'COPY packaging/docker/conf/' packaging/docker/Dockerfile.pack
          grep -q 'COPY bin/superd' packaging/docker/Dockerfile.pack
          stale=0
          for f in Makefile .github/workflows/docker-publish.yml packaging/docker/Dockerfile packaging/docker/Dockerfile.pack; do
            if grep -n 'dockerbuild/' "$f"; then
              echo "::error file=$f::stale docker image path"
              stale=1
            fi
          done
          exit "$stale"

  # PRs that touch docs (push docs-only is paths-ignored → deploy-docs.yml only).
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build docs
        working-directory: ./docs
        env:
          HUGO_BASEURL: https://super.docs.sconts.com/
        run: hugo --minify --printPathWarnings

      - name: Smoke-check published pages
        working-directory: ./docs
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/docs/index.html
          test -f public/docs/01-getting-started/index.html
          test -f public/docs/02-essentials/configuration/index.html
          test -f public/docs/07-editions/feature-matrix/index.html
          # Fail CI if stale commercial hostname leaks into the built site
          if grep -RIn 'super\.project\.sconts\.com' public; then
            echo '::error::Built docs still reference super.project.sconts.com'
            exit 1
          fi

      - name: Rebuild with site-relative baseURL for link check
        working-directory: ./docs
        env:
          # Absolute production URLs cannot be resolved offline; rebuild once for local crawl.
          HUGO_BASEURL: /
        run: |
          rm -rf public
          hugo --minify

      - name: Check internal HTML links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # Prefer --root-dir (site root for absolute /… links). Do not use --base /
          # --base-url here: relative hrefs would resolve against the site root and
          # false-positive as 404s (lychee ≥0.24).
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/docs/public
            --exclude-path ${{ github.workspace }}/docs/public/js
            --exclude-path ${{ github.workspace }}/docs/public/css
            'docs/public/**/*.html'
          fail: true
