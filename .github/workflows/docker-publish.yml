name: Publish Docker Image

# After Release publishes GitHub Release assets, pack linux-amd64 / linux-arm64
# tarballs into schiplat/super (Dockerfile.pack) and merge a multi-arch manifest.
# Never compiles Rust — binaries come only from the Release packages.
#
# Archived from-source + QEMU workflow:
#   .github/workflows-disabled/docker-publish.from-source.yml

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (e.g. 1.5.4). Empty = latest GitHub Release."
        required: false
        type: string

env:
  IMAGE: schiplat/super
  DOCKERFILE_PACK: packaging/docker/Dockerfile.pack

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve version from GitHub Release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
            if [[ -z "${v}" ]]; then
              v="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
            fi
          else
            # Release is tags-only (v*); head_branch is the tag name.
            ref="${{ github.event.workflow_run.head_branch }}"
            if [[ "${ref}" != v* ]]; then
              echo "::error::Expected Release tag ref (v*), got head_branch=${ref}"
              exit 1
            fi
            v="${ref}"
          fi
          v="${v#v}"
          tag="v${v}"
          # Gate on published Release assets (not Actions artifacts / source rebuild).
          gh release view "${tag}" --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name' | grep -qx "super-${v}-linux-amd64.tar.gz"
          gh release view "${tag}" --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name' | grep -qx "super-${v}-linux-arm64.tar.gz"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${tag} (GitHub Release linux packages)"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            release_plat: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            release_plat: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "super-${{ needs.prepare.outputs.version }}-${{ matrix.release_plat }}.tar.gz" \
            --dir release-artifacts

      - name: Extract binaries into bin/
        run: |
          set -euo pipefail
          archive="release-artifacts/super-${{ needs.prepare.outputs.version }}-${{ matrix.release_plat }}.tar.gz"
          test -f "${archive}"
          tar -xzf "${archive}"
          root="super-${{ needs.prepare.outputs.version }}-${{ matrix.release_plat }}"
          test -x "${root}/bin/superd" && test -x "${root}/bin/super"
          mkdir -p bin
          cp "${root}/bin/superd" "${root}/bin/super" bin/
          chmod +x bin/superd bin/super
          file bin/superd bin/super

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}

      - name: Pack image and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PACK }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-pack-${{ matrix.release_plat }}
          cache-to: type=gha,mode=max,scope=docker-pack-${{ matrix.release_plat }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "${digest}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.release_plat }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}

      - name: Merge multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          ls -la
          tag_args="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}")"
          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}"
