name: Publish Docker Image

# Pack Release linux-amd64 / linux-arm64 binaries into schiplat/super.
# Native runners only (no QEMU). Triggered after a successful Release, or manually.
#
# Archived previous (in-image cargo + QEMU multi-arch) workflow:
#   .github/workflows-disabled/docker-publish.from-source.yml

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (e.g. 1.5.4). Empty = latest GitHub Release."
        required: false
        type: string

env:
  IMAGE: schiplat/super
  # Temporary per-arch tags before imagetools merge (never leave these as product tags).
  DOCKERFILE_PACK: packaging/docker/Dockerfile.pack

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_run_id: ${{ steps.ver.outputs.release_run_id }}
      source: ${{ steps.ver.outputs.source }}
    steps:
      - name: Checkout (for gh / version helpers)
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
            if [[ -z "${v}" ]]; then
              v="$(gh release view --json tagName -q .tagName)"
            fi
            v="${v#v}"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "release_run_id=" >> "$GITHUB_OUTPUT"
            echo "Resolved version=${v} (GitHub Release assets)"
          else
            run_id="${{ github.event.workflow_run.id }}"
            ref="${{ github.event.workflow_run.head_branch }}"
            v=""
            if [[ "${ref}" == v* ]]; then
              v="${ref#v}"
            else
              # Release via workflow_dispatch: infer version from artifact names.
              name="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
                --jq '.artifacts[].name | select(test("^super-[0-9].*-linux-amd64$"))' | head -1)"
              if [[ -z "${name}" ]]; then
                echo "::error::Could not resolve version from Release artifacts (run ${run_id}, head_branch=${ref})"
                exit 1
              fi
              # super-1.5.4-linux-amd64 → 1.5.4
              v="${name#super-}"
              v="${v%-linux-amd64}"
            fi
            echo "version=${v}" >> "$GITHUB_OUTPUT"
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
            echo "source=artifact" >> "$GITHUB_OUTPUT"
            echo "release_run_id=${run_id}" >> "$GITHUB_OUTPUT"
            echo "Resolved version=${v} (Release run ${run_id})"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            release_plat: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            release_plat: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release workflow artifacts
        if: needs.prepare.outputs.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.release_run_id }}
          name: super-${{ needs.prepare.outputs.version }}-${{ matrix.release_plat }}
          path: release-artifacts

      - name: Download GitHub Release assets
        if: needs.prepare.outputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern "super-${{ needs.prepare.outputs.version }}-${{ matrix.release_plat }}.tar.gz" \
            --dir release-artifacts

      - name: Extract binaries into bin/
        run: |
          set -euo pipefail
          archive="$(find release-artifacts -name "super-*-${{ matrix.release_plat }}.tar.gz" -print -quit)"
          test -n "${archive}" || { echo "missing archive for ${{ matrix.release_plat }}"; ls -laR release-artifacts; exit 1; }
          tar -xzf "${archive}"
          root="$(find . -maxdepth 1 -type d -name "super-*-${{ matrix.release_plat }}" -print -quit)"
          test -n "${root}" && test -x "${root}/bin/superd" && test -x "${root}/bin/super"
          mkdir -p bin
          cp "${root}/bin/superd" "${root}/bin/super" bin/
          chmod +x bin/superd bin/super
          file bin/superd bin/super

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PACK }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-pack-${{ matrix.release_plat }}
          cache-to: type=gha,mode=max,scope=docker-pack-${{ matrix.release_plat }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "${digest}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.release_plat }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          ls -la
          tag_args="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}")"
          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}"
