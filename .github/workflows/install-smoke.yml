name: Install smoke

# Smoke-test install paths in isolation (manual only):
# - Unix: install.sh against a locally built fake release (--base-url)
# - Never register system/user services or modify the invoking user's login files.
# Docker image build/publish is separate (tags only — see docker-publish.yml).

on:
  workflow_dispatch:

jobs:
  smoke-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: install-smoke-${{ matrix.os }}

      # The smoke script isolates HOME and keeps the normal install pass on
      # --no-service. On macOS it adds PATH-local launchctl failure injection.
      - name: Isolated install smoke
        run: bash tools/scripts/install-smoke.sh --no-service

  smoke-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FreeBSD install smoke
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg update
            # bash is not in FreeBSD base; install-smoke.sh needs it (arrays).
            pkg install -y bash curl git openssl pkgconf python3
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            command -v bash
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            export RUSTFLAGS=""
            # The install pass uses --no-service; dedicated rollback cases point at
            # temporary rc.d/config dirs and a fake service command, never host rc.d.
            bash tools/scripts/install-smoke.sh --no-service
