name: Install smoke

# Smoke-test install paths:
# - Unix: install.sh against a locally built fake release (--base-url)
# - macOS: native runner; FreeBSD: vmactions/freebsd-vm
# - Docker: build+run OSS image on ubuntu-latest (no windows-latest — Linux
#   containers are unreliable on hosted Windows runners)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/install-smoke.sh'
      - 'contrib/**'
      - 'dockerbuild/**'
      - '.github/workflows/install-smoke.yml'
      - '.github/scripts/package-release-unix.sh'
      - '.github/scripts/write-release-readme.sh'
  push:
    branches: [master, main]
    paths:
      - 'install.sh'
      - 'scripts/install-smoke.sh'
      - 'contrib/**'
      - 'dockerbuild/**'
      - '.github/workflows/install-smoke.yml'

jobs:
  smoke-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: install-smoke-${{ matrix.os }}

      # scripts/install-smoke.sh is bash (arrays); do not invoke with dash/sh.
      - name: Install smoke (--user)
        run: bash scripts/install-smoke.sh --user

  smoke-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FreeBSD install smoke
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg update
            # bash is not in FreeBSD base; install-smoke.sh needs it (arrays).
            pkg install -y bash curl git openssl pkgconf python3
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            command -v bash
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            export RUSTFLAGS=""
            # FreeBSD has no systemd/launchd; --user path uses superd --daemon.
            bash scripts/install-smoke.sh --user

  # OSS Docker image smoke (linux/amd64). Not run on windows-latest.
  smoke-docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OSS image
        run: docker build -f dockerbuild/Dockerfile -t super-smoke:local .

      - name: Run container and hit /health
        run: |
          set -euo pipefail
          docker rm -f super-smoke 2>/dev/null || true
          docker run -d --name super-smoke -p 127.0.0.1:9002:9002 super-smoke:local
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9002/health; then
              echo
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            docker logs super-smoke || true
            exit 1
          fi
          docker stop super-smoke
          docker rm super-smoke
