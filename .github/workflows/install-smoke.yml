name: Install smoke

# Smoke-test install paths:
# - Unix: install.sh against a locally built fake release (--base-url)
# - macOS: native runner; FreeBSD: vmactions/freebsd-vm
# Docker image build/publish is separate (tags only — see docker-publish.yml).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/install-smoke.sh'
      - 'contrib/**'
      - '.github/workflows/install-smoke.yml'
      - '.github/scripts/package-release-unix.sh'
      - '.github/scripts/write-release-readme.sh'
  push:
    branches: [master, main]
    paths:
      - 'install.sh'
      - 'scripts/install-smoke.sh'
      - 'contrib/**'
      - '.github/workflows/install-smoke.yml'

jobs:
  smoke-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: install-smoke-${{ matrix.os }}

      # scripts/install-smoke.sh is bash (arrays); do not invoke with dash/sh.
      - name: Install smoke (--user)
        run: bash scripts/install-smoke.sh --user

  smoke-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FreeBSD install smoke
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg update
            # bash is not in FreeBSD base; install-smoke.sh needs it (arrays).
            pkg install -y bash curl git openssl pkgconf python3
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            command -v bash
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            export RUSTFLAGS=""
            # FreeBSD has no systemd/launchd; --user path uses superd --daemon.
            bash scripts/install-smoke.sh --user
