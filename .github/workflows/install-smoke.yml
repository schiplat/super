name: Install smoke

# Smoke-test install paths:
# - Unix: install.sh against a locally built fake release (--base-url)
# - macOS: native runner; FreeBSD: vmactions/freebsd-vm
# - Windows: Docker (documented install path — no native superd.exe)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/install-smoke.sh'
      - 'contrib/**'
      - 'dockerbuild/**'
      - '.github/workflows/install-smoke.yml'
      - '.github/scripts/package-release-unix.sh'
      - '.github/scripts/write-release-readme.sh'
  push:
    branches: [master, main]
    paths:
      - 'install.sh'
      - 'scripts/install-smoke.sh'
      - 'contrib/**'
      - 'dockerbuild/**'
      - '.github/workflows/install-smoke.yml'

jobs:
  smoke-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: install-smoke-${{ matrix.os }}

      # scripts/install-smoke.sh is bash (arrays); do not invoke with dash/sh.
      - name: Install smoke (--user)
        run: bash scripts/install-smoke.sh --user

  smoke-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FreeBSD install smoke
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg update
            pkg install -y curl git openssl pkgconf python3 bash
          run: |
            set -e
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            export RUSTFLAGS=""
            # FreeBSD has no systemd/launchd; --user path uses superd --daemon.
            bash scripts/install-smoke.sh --user

  # Windows has no native release binary; docs recommend Docker Desktop / WSL2.
  smoke-windows-docker:
    name: Windows (Docker)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prefer Linux container engine
        shell: pwsh
        run: |
          $cli = Join-Path $env:ProgramFiles "Docker\Docker\DockerCli.exe"
          if (Test-Path $cli) {
            & $cli -SwitchLinuxEngine 2>$null
            Start-Sleep -Seconds 5
          }
          docker version

      - name: Build OSS image
        run: docker build -f dockerbuild/Dockerfile -t super-smoke:local .

      - name: Run container and hit /health
        shell: pwsh
        run: |
          docker rm -f super-smoke 2>$null
          docker run -d --name super-smoke -p 127.0.0.1:9002:9002 super-smoke:local
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:9002/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) {
                Write-Host "health OK: $($r.Content)"
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            docker logs super-smoke
            throw "Windows Docker smoke: /health did not return 200"
          }
          docker stop super-smoke
          docker rm super-smoke
