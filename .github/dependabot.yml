version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # axum 0.8's `ws` feature pins tokio-tungstenite 0.29 (0.x minor bumps
      # are breaking), so bumping the CLI past 0.29 duplicates the crate in
      # the lockfile. Revisit when axum moves to 0.30.
      - dependency-name: tokio-tungstenite
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    ignore:
      # vue-tsc resolves `typescript/lib/tsc`, which TypeScript 7 (the Go
      # compiler) no longer exports — stay on the 5.x line until vue-tsc
      # supports 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # vue-tsc 3.3.14 has a volar regression: in build mode (`vue-tsc -b`)
      # template expressions are misdetected as refs needing `.value`,
      # producing bogus TS2339s that single-project mode does not report.
      # Re-enable once upstream fixes it.
      - dependency-name: vue-tsc
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Tailwind 4 is a migration (new config model, PostCSS plugin split),
      # not a bump — schedule it deliberately.
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
