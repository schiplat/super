name: Pro trial request
description: Prefer the Portal claim page for free 90-day Super Pro trials
title: "[Pro trial] "
labels: ["pro-trial"]
body:
  - type: markdown
    attributes:
      value: |
        **Preferred:** claim a free 90-day trial on the
        [Super Pro Portal](https://platform.ddl.sconts.com/portal/claim?product=super-pro&plan=first-trials-001)
        (no payment). Use this Issue only if the Portal claim form is unavailable.

        Super is in **public beta**. OSS core is MIT; Pro plugins ship with a
        **free 90-day license** during the beta.
        We recommend staging and non-critical workloads until GA.
        If you must use this Issue, fill it out and we will email the license key and plugin package.
  - type: input
    id: email
    attributes:
      label: Contact email
      description: Where should we send the license key and plugins?
      placeholder: you@example.com
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - linux/amd64
        - linux/arm64
        - darwin/arm64
        - darwin/amd64
        - freebsd/amd64
        - other (specify in notes)
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: One or two sentences — what do you want to try Super for?
      placeholder: e.g. Replace PM2 for a Go API + Redis on a small VPS (homelab / trial only)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Anything else (other platform, Docker-only, etc.)
