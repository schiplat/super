baseURL: "https://super.docs.sconts.com/"
title: Project Super
author:
  name: "Project Super Team"
  email: "support@ddl.sconts.com"
theme: hextra
publishDir: "public"

defaultContentLanguage: en
hasCJKLanguage: true

# Homepage-only translations (*.xx.md next to _index.md). Docs stay English.
languages:
  en:
    label: English
    locale: en-us
    weight: 1
  zh-cn:
    label: 简体中文
    locale: zh-CN
    weight: 2
  ja:
    label: 日本語
    locale: ja-JP
    weight: 3
  es:
    label: Español
    locale: es
    weight: 4
  ru:
    label: Русский
    locale: ru
    weight: 5

markup:
  _merge: shallow
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    copy:
      enable: true
      display: hover
  math:
    engine: mathjax

enableInlineShortcodes: true

# Public client IDs (safe to commit — they appear in page HTML).
# Hextra loads GA only when hugo.IsProduction (CI deploy / `hugo --environment production`).
services:
  googleAnalytics:
    ID: G-RTS2SD8GKS

params:
  description: "Next-gen, High-performance Process Manager"
  # Microsoft Clarity (session heatmaps). Empty projectId disables the snippet.
  # Loaded from layouts/_partials/custom/head-end.html (production only; skipped on /legal/).
  analytics:
    clarity:
      projectId: "ycf86ntw92"

  # Public purchase funnel: homepage → /go/pro/ → this URL.
  # Change checkout_url and redeploy docs only (no superd release).
  purchase:
    checkout_url: "https://ifdian.net/a/hibdmm"
  # Top-of-page release banner (Hextra). key persists the dismiss state in
  # localStorage; message supports Markdown links. Bump key on each release
  # so the banner shows again for returning visitors.
  banner:
    key: "super-release-banner-v1-5-5"
    message: |
      **Super 1.5.5 is here** — free 90-day Pro trial via Portal; optional ¥10/mo OSS tip on Afdian. [See what's new →](/docs/08-changelog/)
  contact:
    api_url: "https://open.schiplat.com/api/v1/demands"
  externalLinkDecoration: true
  theme:
    default: light
    displayToggle: true
  navbar:
    displayTitle: true
    # Keep in sync with params.page.width (Hextra defaults navbar/footer to "normal").
    width: wide
    logo:
      text: Project Super
      fontWeight: "bold"
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    copyright: "© 2026 g1/DDL"
    width: wide
    # Product Hunt review badge in the site footer (layouts/.../custom/footer.html).
    productHunt:
      enable: true
      productId: "1308705"
      reviewUrl: "https://www.producthunt.com/products/super-6/reviews/new?utm_source=badge-product_review&utm_medium=badge&utm_campaign=badge-super-6"
      alt: "Super - process-manager | Product Hunt"
  page:
    # full (100%), wide (90rem), normal (80rem)
    width: wide
    tabs:
      sync: true
  # Docs feedback block at the bottom of docs pages (Docsy-style config).
  # enable: false removes the block entirely.
  ui:
    feedback:
      enable: true
      issueRepo: "schiplat/super"
      sourceURL: "https://github.com/schiplat/super/tree/master/docs"
      text: "Was this page helpful?"
      thanks: "Thanks for your feedback!"
      issuePrompt: "Still have questions?"
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  toc:
    enable: true
    heading: "On this page"
    displayTags: true
  search:
    enable: true
    placeholder: "Search docs..."
  editURL:
    enable: true
    base: "https://github.com/schiplat/super/edit/master/docs/content"
  variables:
    repository:
      home: github.com/schiplat/super

menu:
  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: tryGithub
      name: "Try to ↗"
      url: "https://github.com/schiplat/super"
      weight: 2
  main:
    - identifier: docs
      name: Docs
      url: /docs/
      weight: 1
    - identifier: api
      name: API Reference
      url: /docs/06-internals/api-reference/
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: Language
      weight: 4
      params:
        type: language-switch
    - identifier: github
      name: GitHub
      url: https://github.com/schiplat/super
      weight: 5
      params:
        icon: github
