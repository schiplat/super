worker_processes 1;
error_log /dev/stderr warn;
# Keep pid under the app tree (avoid /tmp races on fast restart).
pid /srv/djangoapp/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;

  upstream django_web {
    server 127.0.0.1:8000;
    keepalive 8;
  }

  server {
    # Demo default: 8088 so a host that already runs nginx on :80 can coexist.
    # Dedicated hosts may change this to listen 80; keep Gunicorn on loopback only.
    listen 127.0.0.1:8088;
    server_name localhost;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_pass http://django_web;
    }
  }
}
