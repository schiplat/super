[workspace]
resolver = "2"
members = [
    "common",
    "core",
    "cli",
    "superd"
]

[workspace.package]
version = "1.8.2"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
super-core = { path = "./core" }
common = { path = "./common" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
base64 = "0.23"
url = "2.5"
ed25519-dalek = "3.0"
rand = "0.9"
# CLI parsing
clap = { version = "4.4", features = ["derive", "env"] }
# Shell completion scripts (`super completions <shell>`)
clap_complete = "4.5"
# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Web & HTTP
axum = { version = "0.8.1", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
# 0.13 defaults to rustls/aws-lc; keep native-tls so the FreeBSD/Docker release
# builds and system cert handling stay exactly as before.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2", "system-proxy"] }
# SQLite persistence for event history (SQL querying, stats, migrations)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
toml = "1.1"
rust-embed = "8.11"
subtle = "2.6"

# Signal handling (Unix only)
nix = { version = "0.27", features = ["signal", "process", "user", "fs"] }


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
#panic = "abort"
